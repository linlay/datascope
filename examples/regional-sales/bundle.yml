    name: 分地区销售演示库
    driver: sqlite
    path: ../../data/regional_sales_demo.sqlite3
    mcpEnabled: true
    mcpPath: regional_sales_demo
    tools:
        - list_tables
        - describe_table
        - query
        - search_knowledge
        - read_knowledge
