database:
    description: "模拟家电与数码产品的跨地区销售经营，可分析销售趋势、目标达成、商品毛利、发货、退货与回款，并比较总部、地区和销售员的业务视角。"
    documentation: |
      # 区域销售演示数据库使用说明

      这个数据库适合体验经营分析和销售跟进。它把地区、公司、销售员、客户、商品、订单、发货、退货、回款与目标联系起来，你可以从“卖得怎么样”追问到“哪里需要跟进”。全部客户和业务记录均为虚构。

      销售业务覆盖 **2024 年 11 月 1 日至 2026 年 10 月 31 日，共 24 个完整月份**。库存是 **2026 年 10 月 31 日** 的快照；分析最近一个月时请明确说“2026 年 10 月”，避免把真实今天当作数据日期。

      ## 从哪里开始

      先在 DataScope 中选择这个演示数据库，点击“使用说明”了解范围。要用自然语言提问，请在已连接本库、并完成业务账号登录的 AI 客户端中发送下面的问题；控制台用于配置、核对查询和预览业务操作。只改变问法不会改变账号权限。

      提问时尽量带上时间、关注对象和希望看到的结果。例如，先要一份概览，再按地区、公司、销售员或商品展开，最后整理需要跟进的清单。可以补充：“请说明统计时间和当前身份可见范围，缺少的数据单独列出。” 金额类结果可以要求按人民币元展示。

      ## 可以直接这样问

      - “请做一份 2026 年 10 月的销售经营概览，按地区列出销售额、商品毛利和目标达成率，并与上月、去年同月比较。”
      - “2026 年 8 月至 10 月，哪些地区销售增长最快？分别观察销量、成交价格和商品结构的变化，区分已有事实与可能原因。”
      - “按地区列出 2026 年 10 月销售额最高的五件商品，以及它们对本地区销售额的贡献。”
      - “哪些销售员在 2026 年 10 月没有完成目标？列出目标、实际完成额和差额，再查看各自主要客户。”
      - “截至 2026 年 10 月 31 日，哪些客户还有逾期未收款？按逾期天数和应收金额排序，列出需要跟进的订单。”
      - “2026 年 10 月哪些订单尚未发完？哪些已经部分退货？请把待处理清单分别列出。”
      - “查看 2026 年 10 月 31 日的库存，各公司哪些商品数量较少？再对照 10 月销量，列为需要人工核查的补货候选。”

      ## 试着连续追问

      先问：“比较 2026 年 10 月各地区的销售额和商品毛利。”

      接着问：“从毛利表现较弱的地区中选一个，按公司、销售员和商品继续展开。”

      再问：“检查这个地区的退货、折扣和回款情况，列出能解释差异的记录，以及还无法从数据确认的原因。”

      也可以要求：“整理成一份经营复盘，先写发现，再附需要销售负责人跟进的客户和订单清单。”这类复盘用于支持判断，不能仅凭关联变化断言原因。

      ## 换一个身份会看到什么

      | 演示账号 | 适合体验的视角 |
      | --- | --- |
      | S0001，总部 | 全国及各地区的整体经营情况。 |
      | S0002，华东负责人；S0003，华南负责人 | 各自地区内的公司、客户和业绩。 |
      | S0009，上海中心分公司负责人 | 本公司的销售、发货和回款情况。 |
      | 107078、900330，销售员 | 各自名下的客户、订单、回款和目标。 |

      不同身份得到的局部汇总不能当作全国总量。订单按成交时的业务归属统计，客户后续换了负责人，也不会把历史订单全部改算给新负责人。客户私人电话和邮箱不向业务查询开放。

      ## 怎样使用分析结果

      这个数据库以查询和分析为主，**不提供销售业务写入动作**。可以请助手生成经营周报、回款跟进清单、未完成目标清单或待发货清单；这些是分析结果，不会自动改单、催款、发货或向客户发送消息。

      需要跟进时，先核对客户、订单、日期和统计范围，再由业务人员处理实际事务。

      ## 阅读结果时留意

      - 销售业绩通常排除待确认和已取消订单；业务订单金额不等同于财务确认收入。可以明确要求分别看下单、发货、退货与回款。
      - 已实际收到的退货才减少净销售；申请中的退货和已退款金额需要分别说明。应收出现负数可能表示有待退客户款，不应直接改成零。
      - 订单可能分批发货、分次回款。请要求“先按订单分别汇总后再比较”，避免明细重复导致金额被放大。
      - 同比、环比要比较相同范围和连续月份；没有记录的月份不自动等于零。商品毛利按成交时保存的成本计算。
      - 当前只有一个库存时点，不能据此还原历史库存周转、过去某天缺货或准确补货需求。
    authentication:
        type: local
        source: DATABASE
        provider:
            id: regional-accounts
            name: 本库业务账号
            type: DEMO_OAUTH
            enabled: true
        access:
            id: database-auth
            name: 本库账号 OAuth
            mode: OAUTH
            providerId: regional-accounts
    id: regional_sales_demo
    name: "区域销售演示数据库"
