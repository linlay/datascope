        <!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>证券账户详情</title><style>:root{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#213b39;background:#f4f7f6;font-size:14px;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:28px}h1{font-size:25px;letter-spacing:-.6px;margin:4px 0 8px}h2{font-size:17px;margin:0 0 16px}p{line-height:1.7}.muted{color:#6b807b}.eyebrow{font-size:11px;letter-spacing:2px;color:#35806d;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:24px}.card{background:#fff;border:1px solid #dce5e1;border-radius:14px;padding:22px;margin-bottom:18px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.metric{border-radius:12px;background:#eaf1ed;padding:18px}.metric strong{font-size:23px;display:block;margin-top:10px;font-variant-numeric:tabular-nums}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.tabs{margin:20px 0}.tabs button[aria-selected=true]{background:#214f43;color:white}button,input,select,textarea{font:inherit;border:1px solid #c7d6d0;border-radius:7px;padding:9px 12px}input,select,textarea{color:inherit;background:#fff}textarea{width:100%;min-height:100px;font-family:ui-monospace,monospace}button{cursor:pointer;background:#fff;color:#254b3e}button.primary{background:#225c49;border-color:#225c49;color:#fff}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){filter:brightness(.94)}label{display:block;margin:14px 0 6px;font-weight:500}form input,form select{width:100%}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #e7eeea}th{font-size:12px;color:#62776e;font-weight:500;background:#f5f8f6}td{font-variant-numeric:tabular-nums}td.money{text-align:right}.notice{padding:12px 15px;border-radius:8px;background:#e9f1ed;line-height:1.6;margin:12px 0;white-space:pre-wrap}.notice.error{color:#9c3030;background:#fff0ed}.tag{font-size:12px;border-radius:5px;background:#e2eee7;color:#285d45;padding:4px 9px}pre{overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f3f6f4;padding:14px;border-radius:8px}dialog{border:1px solid #cfddd6;border-radius:16px;max-width:720px;width:calc(100% - 36px);max-height:90vh;padding:26px;background:white;color:inherit}dialog::backdrop{background:#183a3055}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.details span{display:block;color:#6a8076;font-size:12px;margin-bottom:6px}.details strong{font-weight:500}a{color:#226b51}.empty{padding:34px;text-align:center;color:#6b807b}.status{min-height:24px}#action-receipt{margin-top:16px}@media(max-width:650px){body{padding:14px}.metrics,.details{grid-template-columns:repeat(2,minmax(0,1fr))}.metric strong{font-size:19px}.card{padding:16px}}@media(prefers-color-scheme:dark){:root{background:#172721;color:#e1eae4}.card,dialog{background:#20332b;border-color:#3a5045}input,select,textarea,button{background:#263e32;color:#e1eae4;border-color:#4b6858}.metric,.notice,pre,th{background:#2a4335}.muted,.details span,th{color:#a3b8a9}td,th{border-color:#3b5145}.tag{background:#345a41;color:#d0e9d6}.notice.error{background:#4e302b;color:#ffc4b7}a{color:#9bd6b0}}
        </style><script>// DataScope HTML bridge v1. The host holds credentials; the frame receives data only.
        (() => {
         'use strict';
         let lastData = '';
         let channel = '', listener = () => {}, current, sequence = 0;
         const pending = new Map();
         function rpc(method, params) {
          if (!channel) return Promise.reject(new Error('请在支持 DataScope 视图的宿主中打开。'));
          const id = ++sequence;
          return new Promise((resolve, reject) => {
