          clearTimeout(item.timer); pending.delete(m.id);
          if (m.error) item.reject(new Error(m.error)); else item.resolve(m.result);
         });
         const el = (tag, text, cls) => { const n = document.createElement(tag); if (text !== undefined) n.textContent = text; if (cls) n.className = cls; return n; };
         function table(target, result, rowActions) {
          target.replaceChildren();
          if (!result?.rows?.length) { target.append(el('div', '暂无可见记录', 'empty')); return; }
          const t = el('table'), head = el('tr');
          for (const key of result.columns) head.append(el('th', key));
          if (rowActions) head.append(el('th', '操作'));
          t.append(head);
          for (const row of result.rows) {
           const tr = el('tr');
           for (const key of result.columns) tr.append(el('td', row[key] === null ? '—' : String(row[key] ?? '')));
           if (rowActions) { const td = el('td'); rowActions(td, row); tr.append(td); }
           t.append(tr);
          }
          target.append(t);
          if (result.truncated) target.append(el('p', '结果已截断，请缩小查询范围。', 'muted'));
         }
         function button(text, action) { const b = el('button', text); b.type = 'button'; b.onclick = action; return b; }
         function notice(target, text, error = false) { target.textContent = text; target.className = text ? 'notice' + (error ? ' error' : '') : 'status'; }
         function ask(text) { return new Promise(resolve => { const dialog = el('dialog'), p = el('p',text), buttons = el('div',undefined,'toolbar'); const done = value => {dialog.close();dialog.remove();resolve(value);}; buttons.append(button('取消',()=>done(false)),button('确认',()=>done(true)));dialog.append(p,buttons);dialog.addEventListener('cancel',e=>{e.preventDefault();done(false);},{once:true});document.body.append(dialog);dialog.showModal(); }); }
         const ds = window.datascope = {
          onData(fn) { listener = fn; if (current) fn(current); },
          callTool(name, args = {}) { return rpc('tools/call', { name, arguments: args }); },
          openLink(url) { return rpc('openLink', { url }); },
          el, table, button, notice,
          money(value) { return (Number(value || 0) / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
         };
         // A shared action form is UI only: the server validates schema, ownership and writes.
         ds.actionForm = (root, onCommitted = () => {}) => {
          let name = '', args = {}, requestID = '', attempted = false, busy = false, controls = {}, description;
          const heading = el('h2', '业务操作'), form = el('form'), status = el('div'), preview = el('pre'), links = el('div', undefined, 'toolbar');
          const submit = button('获取操作预览', async () => {
           if (attempted || busy || !form.reportValidity()) return;
           args = {};
           for (const [key, control] of Object.entries(controls)) {
            const field = description.parameters.properties[key];
            if (!control.value && !description.parameters.required.includes(key)) continue;
            args[key] = field.type === 'boolean' ? control.value === 'true' : ['integer', 'number'].includes(field.type) ? Number(control.value) : control.value;
           }
           // Keep the original ID even on transport failure. Never automatically replay writes.
           attempted = true; requestID = crypto.randomUUID(); await invoke(false);
          });
          const lookup = button('查询同一请求结果', () => invoke(true));
          const reset = button('新请求', async () => { if (busy || !await ask('请先核对上一请求结果。确定开始新请求？')) return; attempted = false; requestID = ''; links.replaceChildren(); preview.textContent = ''; notice(status, ''); update(); });
          const actions = el('div', undefined, 'toolbar'); actions.append(submit, lookup, reset);
          root.append(heading, form, status, preview, links, actions);
          function update() { submit.disabled = busy || attempted || !description; lookup.disabled = busy || !attempted; reset.disabled = busy; for (const c of Object.values(controls)) c.disabled = busy || attempted; }
          async function invoke(resultOnly) {
           if (busy || resultOnly && !attempted) return;
           busy = true; update(); notice(status, '正在读取结果…');
           try {
            const out = await ds.callTool('invoke_action', { name, arguments: resultOnly ? {} : args, request_id: requestID, ...(resultOnly ? { result_only: true } : {}) });
            render(out);
            if (out.status === 'done') await onCommitted();
           } catch (e) { notice(status, e.message + '\nrequest_id: ' + requestID, true); }
           finally { busy = false; update(); }
          }
          function render(out) {
           links.replaceChildren(); preview.textContent = JSON.stringify(out.preview || out.result || out, null, 2);
           notice(status, out.status + (out.message ? ' · ' + out.message : '') + '\nrequest_id: ' + requestID, ['denied', 'failed', 'unknown'].includes(out.status));
           if (out.status === 'confirm_required' && out.confirmation_url) links.append(button('打开本人确认页', () => ds.openLink(out.confirmation_url).catch(e => notice(status, e.message, true))));
          }
          return {
           async open(actionName, defaults = {}, existing) {
            if (attempted && !await ask('请先核对上一请求的结果。切换操作后请保留原 request_id 以查询回执。')) return false;
            busy = true; description = undefined; update(); form.replaceChildren(); links.replaceChildren(); preview.textContent = ''; notice(status, '正在读取动作参数…');
            try {
             description = await ds.callTool('describe_action', { name: actionName }); name = actionName; heading.textContent = description.title; controls = {}; attempted = false; requestID = '';
             for (const [key, field] of Object.entries(description.parameters.properties)) {
              const label = el('label', field.description || key); let c;
              if (field.enum || field.type === 'boolean') {
               c = el('select'); if (!description.parameters.required.includes(key)) c.append(el('option', ''));
               for (const value of field.enum || [false, true]) { const option = el('option', String(value)); option.value = String(value); c.append(option); }
              } else { c = el('input'); c.type = ['integer', 'number'].includes(field.type) ? 'number' : 'text'; if (c.type === 'number') { c.step = field.type === 'integer' ? '1' : 'any'; if (field.minimum !== undefined) c.min = String(field.minimum); if (field.maximum !== undefined) c.max = String(field.maximum); } if (field.maxLength !== undefined) c.maxLength = field.maxLength; /* Patterns use the server regexp dialect and are validated there. */ }
              c.name = key; c.required = description.parameters.required.includes(key); c.value = defaults[key] === undefined ? c.value : String(defaults[key]); label.append(c); form.append(label); controls[key] = c;
             }
             notice(status, description.description);
             if (existing?.request_id) { requestID = existing.request_id; attempted = true; args = defaults; if (existing.response) render(existing.response); }
             return true;
            } catch (e) { notice(status, e.message, true); return false; }
            finally { busy = false; update(); }
           }
          };
         };
         addEventListener('DOMContentLoaded', () => parent.postMessage({ type: 'datascope:view:ready' }, '*'));
        })();
        </script></head><body>
        <div class="top"><div><div class="eyebrow">DATASCOPE / SECURITIES</div><h1>证券账户详情</h1><span class="muted">客户资料、资产与委托</span></div><span class="tag">合成演示数据</span></div>
        <section class="card"><div class="toolbar"><label for="account">资金账号</label><input id="account" value="880000000079" maxlength="32"><button id="load" class="primary">查询账户</button></div><div id="status" role="status"></div></section>
        <section id="account-detail" hidden><section class="card"><div class="top"><h2>客户与账户</h2><span id="account-status" class="tag"></span></div><div class="details" id="customer"></div><div class="metrics" id="metrics"></div><p id="date" class="muted"></p><div class="toolbar" id="account-actions"></div></section>
        <section class="card"><div class="toolbar tabs" role="tablist" aria-label="账户记录"><button data-tab="positions" role="tab">持仓</button><button data-tab="orders" role="tab">委托</button><button data-tab="flows" role="tab">资金流水</button></div><div id="records-status" role="status"></div><div id="records" class="scroll"></div></section></section>
        <dialog id="dialog"><div class="toolbar"><button id="close">关闭</button></div><div id="action"></div></dialog>
        <script>
        const ds = window.datascope, byID = id => document.getElementById(id);
        let account, allowed = new Set(), tab = 'positions', stamp = 0, recordsStamp = 0;
        const actionForm = ds.actionForm(byID('action'), async () => { byID('dialog').close(); await load(); });
        const query = (sql, parameters) => ds.callTool('query', {sql, parameters, max_rows:200});
        async function action(name, defaults) { byID('dialog').showModal(); await actionForm.open(name, defaults); }
        function addAction(target, name, label, defaults) { if (allowed.has(name)) target.append(ds.button(label, () => action(name, defaults))); }
        function detail(label, value) { const div = ds.el('div'); div.append(ds.el('span', label), ds.el('strong', String(value ?? '—'))); return div; }
        async function load() {
         const token = ++stamp; ++recordsStamp; const number = byID('account').value.trim();
         account = undefined; byID('account-detail').hidden = true; ds.notice(byID('status'), '正在查询…'); byID('load').disabled = true;
         try {
          const result = await query('SELECT f.fund_account_no, f.customer_no, f.status AS account_status, f.currency, f.manager_id, c.name AS customer_name, c.mobile, c.risk_level, c.investor_type FROM fund_accounts f JOIN customers c ON c.customer_no = f.customer_no WHERE f.fund_account_no = :arg_account', {arg_account:number});
          if (token !== stamp) return;
          account = result.rows[0]; if (!account) { ds.notice(byID('status'), '没有可见的账户记录。'); return; }
          allowed = new Set();
          try { const list = await ds.callTool('list_actions'); if (token !== stamp) return; allowed = new Set(list.actions.map(a => a.name)); } catch { /* Query-only users can still read the account. */ }
          const customer = byID('customer'); customer.replaceChildren();
          for (const [label,key] of [['客户编号','customer_no'],['客户姓名','customer_name'],['手机号','mobile'],['风险等级','risk_level'],['投资者类型','investor_type'],['资金账号','fund_account_no']]) customer.append(detail(label, account[key]));
          byID('account-status').textContent = account.account_status === 'active' ? '正常' : account.account_status === 'frozen' ? '冻结' : account.account_status;
          byID('account-detail').hidden = false; ds.notice(byID('status'), '');
          const actions = byID('account-actions'); actions.replaceChildren(); const accountArgs = {fund_account_no:account.fund_account_no}, customerArgs = {customer_no:account.customer_no};
          addAction(actions,'update_customer_mobile','修改手机号',{...customerArgs,mobile:account.mobile});
          addAction(actions,'update_customer_risk_level','调整风险等级',{...customerArgs,risk_level:account.risk_level});
          addAction(actions, account.account_status === 'frozen' ? 'unfreeze_fund_account' : 'freeze_fund_account', account.account_status === 'frozen' ? '解冻账户' : '冻结账户',accountArgs);
          if (account.account_status === 'active') { addAction(actions,'deposit_demo_cash','演示入金',accountArgs); addAction(actions,'withdraw_demo_cash','演示出金',accountArgs); }
          byID('metrics').replaceChildren(); byID('date').textContent = '正在读取最新可见账期…';
          try {
           const balance = await query('SELECT trade_date, closing_balance, available_balance, withdrawable_balance FROM daily_balances WHERE fund_account_no = :arg_account ORDER BY trade_date DESC LIMIT 1', {arg_account:number});
           const holdings = await query('SELECT trade_date, SUM(market_value_cents) AS market_value FROM positions WHERE fund_account_no = :arg_account GROUP BY trade_date ORDER BY trade_date DESC LIMIT 1', {arg_account:number});
           if (token !== stamp) return;
           const b = balance.rows[0], h = holdings.rows[0];
           for (const [label,value] of [['资金余额',b?.closing_balance],['可用余额',b?.available_balance],['可取余额',b?.withdrawable_balance],['持仓市值',h?.market_value]]) { const card=ds.el('div',undefined,'metric'); card.append(ds.el('span',label),ds.el('strong',value === undefined ? '—' : ds.money(value))); byID('metrics').append(card); }
           byID('date').textContent = `币种 ${account.currency} · 资金账期 ${b?.trade_date || '无记录'} · 持仓日期 ${h?.trade_date || '无记录'}`;
          } catch(e) { if (token === stamp) byID('date').textContent = '资金或持仓读取失败：' + e.message; }
          await records();
         } catch(e) { if (token === stamp) { account = undefined; byID('account-detail').hidden = true; ds.notice(byID('status'), e.message, true); } }
         finally { if (token === stamp) byID('load').disabled = false; }
        }
        async function records() {
         if (!account) return;
         const token = ++recordsStamp, accountToken = stamp, selected = tab, number = account.fund_account_no;
         document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected',String(b.dataset.tab === selected)));
         ds.notice(byID('records-status'),'正在查询…'); byID('records').replaceChildren();
         const sql = {
          positions:'SELECT security_code, trade_date, quantity, available_quantity, cost_cents, close_price, market_value_cents FROM positions WHERE fund_account_no = :arg_account AND trade_date = (SELECT MAX(trade_date) FROM positions WHERE fund_account_no = :arg_account) ORDER BY security_code',
          orders:'SELECT order_no, trade_date, security_code, side, quantity, filled_quantity, status, channel FROM orders WHERE fund_account_no = :arg_account ORDER BY trade_date DESC, order_no DESC',
          flows:'SELECT trade_date, flow_type, amount_cents, balance_after FROM cash_flows WHERE fund_account_no = :arg_account ORDER BY id DESC'
         }[selected];
         try { const result=await query(sql,{arg_account:number}); if (token !== recordsStamp || accountToken !== stamp) return;
         const labels={security_code:'证券代码',trade_date:'交易日期',quantity:'数量',available_quantity:'可用数量',cost_cents:'成本（元）',close_price:'收盘价（元）',market_value_cents:'持仓市值（元）',order_no:'委托编号',side:'方向',filled_quantity:'成交数量',status:'委托状态',channel:'来源渠道',flow_type:'流水类型',amount_cents:'金额（元）',balance_after:'流水后余额（元）'};
         const money=new Set(['cost_cents','close_price','market_value_cents','amount_cents','balance_after']);
         const values={BUY:'买入',SELL:'卖出',PARTIAL:'部分成交',FILLED:'全部成交',CANCELLED:'已撤销',PART_CANCELLED:'部分成交后撤销',REJECTED:'已拒绝',DEPOSIT:'入金',WITHDRAWAL:'出金'};
         const shown={...result,columns:result.columns.map(k=>labels[k]||k),rows:result.rows.map(row=>{const out={...row};for(const k of result.columns)out[labels[k]||k]=money.has(k)?ds.money(row[k]):values[row[k]]||row[k];return out;})};
         ds.table(byID('records'),shown,selected === 'orders' ? (td,row) => { if (Number(row.quantity) > Number(row.filled_quantity) && !['CANCELLED','PART_CANCELLED','FILLED','REJECTED'].includes(row.status)) addAction(td,'cancel_order_remainder','撤销剩余委托',{order_no:row.order_no}); } : undefined); ds.notice(byID('records-status'), '金额和价格已由分转换为元。' + (result.truncated ? '结果已截断，请缩小范围。' : '')); }
         catch(e) { if (token === recordsStamp && accountToken === stamp) ds.notice(byID('records-status'),e.message,true); }
        }
        byID('load').onclick=load; byID('close').onclick=()=>byID('dialog').close();
        document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;records()});
        ds.onData(data => { const input = data.input || {}; const number = input.fund_account_no || input.parameters?.arg_account || data.result?.rows?.[0]?.fund_account_no; if (number) byID('account').value=number; load(); });
        </script></body></html>
      published: true
    - id: securities_customers
      name: 客户列表
      description: 按姓名或编号搜索客户，筛选客户类型与风险等级，分页查看并打开客户详情。
