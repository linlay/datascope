            } catch (e) { notice(status, e.message, true); return false; }
            finally { busy = false; update(); }
           }
          };
         };
         addEventListener('DOMContentLoaded', () => parent.postMessage({ type: 'datascope:view:ready' }, '*'));
        })();
        </script></head><body>
        <div class="top"><div><div class="eyebrow">DATASCOPE / ACTION</div><h1>动作预览与结果</h1><span class="muted">读取动作参数 → 获取真实预览 → 本人确认 → 查询回执</span></div><span class="tag">本人确认</span></div>
        <section class="card"><div class="toolbar"><label for="name">动作名称</label><input id="name" placeholder="请输入动作名称"><button id="load" class="primary">读取参数</button></div><div id="status" role="status"></div></section><section class="card" id="action"></section>
