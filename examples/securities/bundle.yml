database:
    description: "模拟证券经纪业务，可用自然语言了解客户资产、持仓、成交和资金变化，并体验客户经理与管理人员的不同视角及需确认的账户操作。"
    documentation: |
      # 证券演示数据库使用说明

      这个数据库适合体验客户经营、资产查询与账户管理。它包含 1,500 位虚构客户及其资金账户、证券账户、委托、成交、资金流水和日终资产。你可以从营业部经营概览开始，逐步追问到某位客户、某个账户和某笔业务。

      当前主要业务窗口为 **2026 年 9 月 15 日至 10 月 20 日，共 20 个交易日**；最新资产日期为 **2026 年 10 月 20 日**。这里的“最新”指数据日期，不是电脑今天的日期。

      ## 从哪里开始

      先在 DataScope 中选择这个演示数据库，点击“使用说明”了解范围。要用自然语言提问，请在已连接本库、并完成业务账号登录的 AI 客户端中发送下面的问题；控制台用于配置、核对查询和预览业务操作。只改变问法不会改变账号权限。

      提问时尽量带上时间、关注对象和希望看到的结果。例如，先要一份概览，再按营业部、客户或资金账户展开，最后整理需要跟进的清单。可以补充：“请说明统计时间和当前身份可见范围，缺少的数据单独列出。” 金额类结果可以要求按人民币元展示。

      ## 可以直接这样问

      - “截至 2026 年 10 月 20 日，我能看到多少客户和资金账户？请分别汇总资金余额、证券市值，并说明金额单位。”
      - “在我能看到的客户中，哪些客户的证券市值最高？列出前十位，并分账户展示，避免把同一客户重复计数。”
      - “2026 年 9 月 15 日至 10 月 20 日，各营业部的买入额、卖出额和交易费用分别是多少？哪些客户交易最活跃？”
      - “比较 2026 年 9 月 15 日和 10 月 20 日的持仓，哪些证券的持有数量变化较大？把数量变化与价格变化分开说明。”
      - “找出 2026 年 10 月 20 日有资金余额但可取金额较少的账户，分别列余额、可用金额和可取金额，不推测数据里没有记录的原因。”
      - “在当前可见范围内，找出部分成交且仍有未成交余量的委托，列出委托号、日期、已成交数量和剩余数量，先不要执行撤单。”

      ## 试着连续追问

      先问：“请概览 2026 年 10 月 20 日我能看到的客户资产。”

      接着问：“把证券市值最高的五位客户展开，列出每位客户的各个账户和主要持仓。”

      再问：“选第一位客户，查看 9 月 15 日至 10 月 20 日的成交和资金变动。哪些变化有交易记录支持，哪些还需要进一步核对？”

      这条路径适合练习从汇总到明细核查。账户资产、成交金额和资金净流入是不同概念，不应直接互相替代。

      ## 换一个身份会看到什么

      | 演示账号 | 适合体验的视角 |
      | --- | --- |
      | E0001，客户经理 | 查看本人负责的账户、相关客户和交易，整理客户跟进清单。 |
      | E0121，营业部主管 | 查看有效授权营业部的经营情况，比较客户和账户分布。 |
      | E0175，业务管理员 | 查看全库业务概览，核对不同管理视角的汇总范围。 |

      请使用管理员已提供的对应账号登录；管理员已授权的身份模拟也可用于核对。仅在问题里写“我是管理员”不会切换权限。同一客户可能有多个账户，看到客户资料不表示可以查看其全部账户。

      ## 怎样体验业务操作

      可以先问：“请找出一笔我有权处理的委托，预览撤销未成交余量会改动什么，先不要提交。”也可以体验修改客户资料、冻结或解冻账户、调整客户经理，以及演示资金账户内记账。并非每个角色都能办理所有操作，跨账户或跨机构操作需要另外的权限检查。

      先查看受影响对象、修改前后内容及原因；需要正式执行时，通过已配置的业务动作由相应业务账号本人确认。查询有权限不等于允许修改。涉及资金的操作只更改本地演示记录，不发生真实入金、出金或银行划转。

      ## 阅读结果时留意

      - 资产和持仓按某一天查看，不把多天的余额加起来当作当前资产。可用金额、可取金额与资金余额应分别解释。
      - 本地已缩减历史，少量关键回归账户额外保留较早的委托与流水。比较成交额和客户活跃度时，统一使用 2026 年 9 月 15 日至 10 月 20 日，不直接比较无日期条件的历史累计值。
      - 窗口第一天的日初余额承接此前历史。更早完整业务应查备份；查不到记录不表示当时没有资产或交易。
      - 客户、行情和交易均为虚构数据；本库用于体验查询和受控操作，不连接真实交易系统。
    queryViewId: query
    writeEnabled: true
    authentication:
        type: local
        employeeDirectory: true
        source: DATABASE
        provider:
            id: securities-accounts
            name: 本库业务账号
            type: DEMO_OAUTH
            enabled: true
        access:
            id: database-auth
            name: 本库账号 OAuth
            mode: OAUTH
            providerId: securities-accounts
    id: securities_demo
    name: "证券演示数据库"
    driver: sqlite
    path: ../../data/securities_demo.sqlite3
    mcpEnabled: true
    mcpPath: securities_demo
    tools:
        - list_tables
        - describe_table
        - query
        - search_knowledge
        - read_knowledge
        - list_actions
        - describe_action
        - invoke_action
policyFile: rewrite.yml
sqlExamplesFile: sql-examples.yml
version: 1
viewsFile: views.yml
