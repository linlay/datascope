accounts:
    - businessUserId: 1
      name: 商店查询员
      permissions:
        - query
      username: SHOP001
database:
    description: "虚构商店的客户、商品和订单数据，支持销售额、商品排行及库存分析。"
    documentation: |
      # 商店演示库

      ## 数据内容与关系

      虚构的商店销售数据，适合演示客户归属、订单分析、商品排行与库存查询。示例生成器默认提供 200 位客户、100 件商品、3,000 张订单，订单覆盖 2026 年 5 月至 10 月；实际范围应以库内查询为准。它是演示快照，不会自动同步真实电商系统。

      - customers：客户，owner_employee_id 标识归属业务员工。
      - products：商品，包含 SKU、售价和当前库存。
      - orders：每行是一笔单商品订单，通过 customer_id 和 product_id 分别关联客户和商品，包含数量、成交单价、状态与下单时间。

      ## 统计口径与注意事项

      金额以整数分保存。销售额为 quantity * unit_price_cents，使用订单成交价格，不使用商品当前售价。只有 paid 和 shipped 计入销售额，pending 与 cancelled 不计入。转为元时除以 100.0。

      库存是商品当前值，不是历史库存流水；零库存不等于过去缺货。没有订单的客户、没有销量的商品都正常存在，可用 LEFT JOIN 查询，避免内连接遗漏。

      SHOP001 的业务身份为 1，仅能查看归属本人的客户和订单；商品目录全员可读，成本字段不向业务查询开放。不同业务身份的排行和汇总可能不同。

      ## 如何查询

      在「查询工作台」选择本库和业务身份，先查看可访问表与字段，再执行只读 SELECT。MCP 客户端依次使用 list_tables、describe_table、query；有知识读取权限时，可用 search_knowledge / read_knowledge 查阅专题口径。下面的 SQL 可复制到查询工作台，只在执行时读取数据，不会自动运行。

      所有结果均受当前身份的表、字段与行权限及行数上限约束；可见小计不代表全库总量。说明和示例不授予额外权限。写入只能通过已配置的 Action 及其确认流程完成。

      ## 查询示例

      ### 月度销售额（已付款及已发货）

      ```sql
      SELECT substr(created_at,1,7) AS month,COUNT(*) AS orders,SUM(quantity*unit_price_cents) AS revenue_cents FROM orders WHERE status IN ('paid','shipped') GROUP BY substr(created_at,1,7) ORDER BY month;
      ```

      ### 客户销售排行

      ```sql
      SELECT c.id,c.name,SUM(o.quantity*o.unit_price_cents) AS revenue_cents FROM customers c JOIN orders o ON o.customer_id=c.id WHERE o.status IN ('paid','shipped') GROUP BY c.id,c.name ORDER BY revenue_cents DESC,c.id LIMIT 20;
      ```

      ### 商品销量排行

      ```sql
      SELECT p.id,p.name,SUM(o.quantity) AS units FROM products p JOIN orders o ON o.product_id=p.id WHERE o.status IN ('paid','shipped') GROUP BY p.id,p.name ORDER BY units DESC,p.id LIMIT 20;
      ```

      ### 订单状态分布

      ```sql
      SELECT status,COUNT(*) AS orders FROM orders GROUP BY status ORDER BY status;
      ```

      ### 暂无订单的客户

      ```sql
      SELECT c.id,c.name FROM customers c LEFT JOIN orders o ON o.customer_id=c.id WHERE o.id IS NULL ORDER BY c.id;
      ```

      ### 零库存商品

      ```sql
      SELECT id,sku,name,stock_quantity FROM products WHERE stock_quantity=0 ORDER BY id;
      ```
    authentication:
        type: local
        source: DATABASE
        provider:
            id: shop-accounts
            name: 本库业务账号
            type: DEMO_OAUTH
            enabled: true
        access:
            id: database-auth
            name: 本库账号 OAuth
            mode: OAUTH
            providerId: shop-accounts
    id: shop_demo
    name: 商店演示库
    driver: sqlite
    path: ../../data/shop_demo.sqlite3
    mcpEnabled: true
    mcpPath: shop_demo
    tools:
        - list_tables
        - describe_table
        - query
        - search_knowledge
        - read_knowledge
policyFile: rewrite.yml
sqlExamplesFile: sql-examples.yml
version: 1
