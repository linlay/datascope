version: 1
database:
  description: "模拟一所高校的日常教务，可查询课表、选课、成绩、考勤与考试，体验学生、教师、辅导员和教务人员的不同权限及成绩办理流程。"
  documentation: |
    # 高校教务演示数据库使用说明

    这个数据库适合体验校园教务查询、学业跟进和教学办理。背景是虚构的澄江应用技术学院，包含 5 个学院、1,000 名学生和 80 名教师，以及课程、课表、选课、考勤、成绩和考试安排。

    数据快照截至 **2026 年 11 月 13 日**，覆盖已结束的 **2026 年春季学期**和正在进行的 **2026 年秋季学期**。春季适合分析完整成绩，秋季适合查看课表、考勤、成绩录入进度和考试安排。

    ## 从哪里开始

    先在 DataScope 中选择这个演示数据库，点击“使用说明”了解范围。要用自然语言提问，请在已连接本库、并完成业务账号登录的 AI 客户端中发送下面的问题；控制台用于配置、核对查询和预览业务操作。只改变问法不会改变账号权限。

    提问时尽量带上时间、关注对象和希望看到的结果。例如，先要一份概览，再按学院、课程、教学班或学生展开，最后整理需要跟进的清单。可以补充：“请说明统计时间和当前身份可见范围，缺少的数据单独列出。”

    ## 可以直接这样问

    - 学生视角：“请列出我 2026 年秋季学期每周的课表，包括课程、星期、节次、教室和任课教师。”
    - 学生视角：“我已经能查看哪些正式发布的成绩？把缺考、尚未录入和已经评分但尚未发布的情况分清楚，只展示我有权查看的内容。”
    - 辅导员视角：“在我负责的学生中，2026 年秋季截至 11 月 13 日哪些人缺勤较多？先列出考勤记录，再给出需要人工了解情况的名单。”
    - 教师视角：“我负责的教学班有哪些考核还没有完成成绩录入？分别列出考核时间、待录入人数和是否已经发布。”
    - 教务视角：“按课程比较 2026 年春季学期已经完整发布成绩的平均分和通过率，说明实际参与统计的人数。”
    - “2026 年秋季有哪些重修记录？把原学期和本学期分开列出，不把不同学期的成绩混在一起。”
    - “查看我有权了解的秋季考试安排，列出课程、考试日期、节次和教室。”

    ## 试着连续追问

    先用辅导员视角问：“列出我负责班级在秋季学期的考勤情况。”

    接着问：“只看缺勤较多的学生，按课程和日期展开，区分缺勤、迟到与请假。”

    再问：“结合我有权看到的已发布成绩和重修记录，整理一份学业关怀清单。不要把考勤相关性直接当成成绩变化的原因。”

    同一条问题换成学生身份，应只返回本人范围；换成教师身份，应围绕本人授课的教学班。

    ## 换一个身份会看到什么

    | 演示账号 | 适合体验的视角 |
    | --- | --- |
    | 202301001，学生 | 本人课表、选课、考勤、历史学分及已发布成绩。 |
    | T1001，教师 | 本人授课教学班的学生、考勤及成绩录入；主讲教师才可发布成绩。 |
    | F2001，辅导员 | 有效任职班级的学生、学业记录和已发布成绩，只读。 |
    | ACA002，学院教务员 | 本学院学生的教务情况，以及本学院课程的教室调整。 |
    | ACA001，教务管理员 | 全校教务概览与教室调整；不能冒用学生选课或代替教师发布成绩。 |

    辅导员的班级范围随任职日期变化，成绩可见性也受发布时点限制。如果发现结果不同，先核对账号、学期和系统演示日期。授课关系不授予读取学生私人联系方式的权限。

    ## 怎样体验业务操作

    教师可以问：“找出我有权录入、且尚未发布成绩的一项考核，先预览录入一名学生成绩需要核对哪些信息。”主讲教师在全部相关学生成绩齐备、考核日期已到后，才可申请发布；发布后成绩锁定。

    学院教务员可以问：“为本学院一门课程预览调整上课教室，检查教室类型、容量和时间冲突，先不要提交。”更换上课教室不会顺便修改已经排好的考试地点。

    当前默认快照已经过了秋季选退课期限，选课和退课被拒绝是正常结果。要演示成功选退课，需要管理员准备相应开放期的演示环境，不能在提问中随意指定办理日期来绕过期限。

    所有修改先预览，再由具备相应权限的业务账号本人确认。操作只影响本地虚构教务记录。

    ## 阅读结果时留意

    - 尚未录入的成绩不是零分；缺考记零分，与待录入分开统计。学生看不到未发布的成绩，不能据此判断老师没有评分。
    - 完整课程总分按作业 30%、期中 20%、期末 50% 加权；只有全部考核已发布的课程才参与完整总分和通过率统计，通过线为 60 分。
    - 页面中的选课人数可能只是当前身份能看到的部分学生，不能据此认定还有剩余名额。实际选课会独立检查容量、先修课、学分和课表冲突。
    - 秋季期末考试可能是未来安排，尚未出现的成绩和考勤不应被编造。行政班与课程教学班是两种分组，不要混为一谈。
  id: "academic_demo"
  name: "高校教务演示数据库"
  driver: "sqlite"
  path: "../../data/academic_demo.sqlite3"
  writeEnabled: true
  mcpEnabled: true
  mcpPath: "academic_demo"
  authentication:
    type: "local"
    source: "DATABASE"
    provider:
      id: "academic-accounts"
      name: "本库教务账号"
      type: "DEMO_OAUTH"
      enabled: true
    access:
      id: "database-auth"
      name: "本库账号 OAuth"
      mode: "OAUTH"
      providerId: "academic-accounts"
  tools:
    - "list_tables"
    - "describe_table"
    - "query"
    - "search_knowledge"
    - "read_knowledge"
    - "list_actions"
    - "describe_action"
    - "invoke_action"
