version: 1
schemes:
  -
    scheme: "CUSTOM"
    name: "高校教务角色与成绩发布权限"
    description: "学生、教师、辅导员、学院教务员与教务管理员"
tables:
  -
    table: "assessments"
    scheme: "CUSTOM"
    columns:
      - "id"
      - "section_id"
      - "name"
      - "kind"
      - "weight"
      - "assessment_date"
    reason: "可信教务身份；学生本人、授课教学班、有效辅导员任职及学院范围；成绩发布前仅授权教职人员可见"
    sql: "SELECT t.id, t.section_id, t.name, t.kind, t.weight, t.assessment_date FROM main.assessments t"
    denyUnless: "EXISTS (SELECT 1 FROM main.users actor WHERE actor.id=${userId} AND actor.active=1)"
    denyMessage: "需要有效的本库教务身份"
  -
    table: "attendance"
    scheme: "CUSTOM"
    columns:
      - "id"
      - "enrollment_id"
      - "meeting_id"
      - "attendance_date"
      - "status"
      - "recorded_by"
    reason: "可信教务身份；学生本人、授课教学班、有效辅导员任职及学院范围；成绩发布前仅授权教职人员可见"
    sql: "SELECT t.id, t.enrollment_id, t.meeting_id, t.attendance_date, t.status, t.recorded_by FROM main.attendance t WHERE t.enrollment_id IN (SELECT e.id FROM main.enrollments e WHERE (e.student_id IN (SELECT s.id FROM main.students s WHERE EXISTS (SELECT 1 FROM main.users u WHERE u.id=${userId} AND u.active=1 AND (u.role='REGISTRAR' OR (u.role='SCHOOL_ADMIN' AND u.school_id=(SELECT school_id FROM main.users WHERE id=s.id)) OR (u.role='STUDENT' AND u.id=s.id) OR (u.role='COUNSELOR' AND EXISTS(SELECT 1 FROM main.counselor_assignments ca WHERE ca.class_id=s.class_id AND ca.counselor_id=u.id AND ca.valid_from<=date(${asOf},'+8 hours') AND (ca.valid_to IS NULL OR ca.valid_to>date(${asOf},'+8 hours'))))))) OR EXISTS(SELECT 1 FROM main.section_teachers st JOIN main.users u ON u.id=st.teacher_id AND u.active=1 WHERE st.section_id=e.section_id AND st.teacher_id=${userId})))"
    denyUnless: "EXISTS (SELECT 1 FROM main.users actor WHERE actor.id=${userId} AND actor.active=1)"
    denyMessage: "需要有效的本库教务身份"
