    sql: "SELECT t.account_id,t.metric_date,t.batch_id,t.new_followers,t.unfollows,t.followers_end,t.availability FROM main.account_daily_metrics t WHERE (EXISTS(SELECT 1 FROM main.users u WHERE u.id=${userId} AND u.active=1 AND u.role='ADMIN') OR EXISTS(SELECT 1 FROM main.account_grants g WHERE g.account_id=t.account_id AND g.user_id=${userId} AND g.valid_from<=date(${asOf},'+8 hours') AND (g.valid_to IS NULL OR g.valid_to>date(${asOf},'+8 hours'))))"
    denyUnless: "EXISTS(SELECT 1 FROM main.users u WHERE u.id=${userId} AND u.active=1)"
    denyMessage: "需要有效运营身份及相应数据能力"
