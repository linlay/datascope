version: 1
database:
  id: "channel_operations_demo"
  name: "渠道与社交媒体运营演示数据库"
  description: "模拟双品牌的多平台内容运营，可追踪选题、审核、发布与评论，分析账号表现、推广投入和转化，并体验内部团队与外部协作的分工。"
  documentation: |
    # 渠道与社交媒体运营演示数据库使用说明

    这个数据库适合体验内容运营复盘、跨团队协作和账号日常管理。虚构品牌“原野生活”和“山岚营地”在 4 个模拟平台经营 12 个账号，包含 600 个选题、1,600 次发布任务，以及推广、评论和转化记录。

    数据快照截至 **2026 年 11 月 13 日**，包含 **2026 年 5—10 月的历史表现**、11 月近期工作及未来排期。分析最近完整月份时请明确使用“2026 年 10 月”；检查待办时应区分计划时间、实际发布时间与数据采集时间。

    ## 从哪里开始

    先在 DataScope 中选择这个演示数据库，点击“使用说明”了解范围。要用自然语言提问，请在已连接本库、并完成业务账号登录的 AI 客户端中发送下面的问题；控制台用于配置、核对查询和预览业务操作。只改变问法不会改变账号权限。

    提问时尽量带上时间、关注对象和希望看到的结果。例如，先要一份概览，再按品牌、平台、账号、选题或活动展开，最后整理需要跟进的清单。可以补充：“请说明统计时间和当前身份可见范围，缺少的数据单独列出。” 金额类结果可以要求按人民币元展示。

    ## 可以直接这样问

    - “请概览我有权查看的账号在 2026 年 10 月的运营表现，按平台分别列阅读或播放、互动及关注变化，并标出数据缺失。”
    - “2026 年 10 月哪些内容表现较好？先在同一平台内排名，再比较它们的选题、发布时间和自然与付费表现。”
    - “截至 2026 年 11 月 13 日，哪些内容还在等审核、哪些排期尚未发布、哪些任务失败了？按账号、负责人和失败原因列成待办清单。”
    - 分析员视角：“比较 2026 年 10 月各活动的推广消耗、点击和有效站内转化，单列无法确认来源的转化，不把平台报告转化和站内转化相加。”
    - “同一个选题在不同平台用了什么标题和内容版本？先展示各平台改编，再列出有权查看的效果指标，说明比较限制。”
    - 运营视角：“列出我有权处置的待处理评论，显示所属账号、内容和原文，按时间排序，先不要回复。”
    - “找出存在指标缺失、补报或累计值下调的内容，说明哪些比较需要等数据补齐后再做。”

    ## 试着连续追问

    先问：“比较 2026 年 10 月各活动在同一平台的内容表现。”

    接着问：“选一个阅读或播放较高、但站内有效转化较少的活动，检查推广点击、落地访问和有效线索。”

    再问：“把未知来源、重复线索和缺失指标单独列出，整理成复盘：已经确认的事实、可能原因、需要补查的问题。”

    这样可以练习从内容表现追问到转化链路。某个活动表现好，不等于数据已经证明推广产生了同等数量的新增用户。

    ## 换一个身份会看到什么

    | 演示账号 | 适合体验的视角 |
    | --- | --- |
    | OPS001，管理员 | 全部运营记录、跨团队概览与授权范围内的业务操作。 |
    | OPS002，负责人 | 本团队内容、有效授权账号、审核和编辑分工。 |
    | OPS003，分析员 | 有效授权范围的表现、推广成本和归因，只读。 |
    | OPS004，编辑 | 本人负责的选题、版本及相关效果，提交内容审核。 |
    | OPS005，账号运营 | 有效授权账号的发布和评论；可操作授权才允许办理。 |
    | OPS006，外部协作 | 明确分配的内容及相关效果；不能查看推广成本和内部评论处置。 |
    | OPS007，另一团队负责人 | 对照另一团队的内容和授权范围，体验跨团队隔离。 |

    内容分工与账号操作权限是两回事。只读授权、过期授权或暂停账号不能用于发布操作；编辑能看到某个选题，也不代表可以处理对应账号的评论。

    ## 怎样体验业务操作

    编辑可以问：“找一个分配给我的草稿版本，先预览提交审核。”负责人可以问：“查看团队待审核版本，核对内容后预览通过或驳回，不能审核自己的稿件。”

    运营可以问：“从我有权操作的账号中选一个已审核内容，预览安排发布时间。”也可以体验对待处理评论进行通过、隐藏或回复；回复前先展示完整文本、目标评论和账号，并等待本人确认。

    只有已经到达计划时间的排期任务，才允许登记模拟发布成功或失败。六类操作均先预览，再由具备权限的业务账号本人确认。**所有发布、排期和评论回复都只更改本地演示记录，不会连接真实平台或向外发送内容。**

    ## 阅读结果时留意

    - 不同平台的阅读、播放和曝光口径不同，不能简单相加后称为去重触达人数；关注存量也不能跨日累加。
    - 数据缺失不等于零，晚到和修订可能改变先前读数。累计快照不能逐日相加，也不能把修订后的差额直接当成当天新增。
    - 有的平台不能区分自然与付费，这一部分应保留未知，不能全部算作自然流量，也不能把总量与其中的付费量再次相加。
    - 站内有效转化采用七天内最后点击归因，重复和无效线索不计入有效转化；无法确认来源的转化单列。平台报告转化与站内记录分别展示。
    - 评论只是运营抽样，不是全量归档。看不到某条评论、某项成本或某个账号时，先核对采集范围与身份授权。
