name: datascope-import-demo
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_ADMIN_PASSWORD:?generate the local environment first}
      MYSQL_DATABASE: imports
      MYSQL_USER: import_reader
      MYSQL_PASSWORD: ${DEMO_READER_PASSWORD:?generate the local environment first}
    ports: ["127.0.0.1:13316:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 60
  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${DEMO_ADMIN_PASSWORD:?generate the local environment first}
      POSTGRES_DB: imports
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imports"]
      interval: 5s
      timeout: 5s
      retries: 60
  oracle:
    image: ghcr.io/gvenzl/oracle-free:23.26.3-slim
    environment:
      ORACLE_PASSWORD: ${DEMO_ADMIN_PASSWORD:?generate the local environment first}
      APP_USER: IMPORTS
      APP_USER_PASSWORD: ${DEMO_READER_PASSWORD:?generate the local environment first}
    ports: ["127.0.0.1:11521:1521"]
    volumes: ["oracle-data:/opt/oracle/oradata"]
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
volumes:
  mysql-data:
  postgres-data:
  oracle-data:
