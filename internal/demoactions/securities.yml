  - name: "transfer_demo_cash"
    title: "同客户资金账户演示划转"
    description: "同客户、同币种、最新账期内原子划转；两账户均须本人管理或由业务管理员执行。四条写入同时成功或同时回滚。"
    confirm: true
    parameters:
      source_fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      target_fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      amount_cents: {"type": "integer", "description": "金额单位为分，例如 10000 为100元；仅演示记账，无外部支付", "min": 1, "max": 100000000}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator } = require("./employee");
      const { ownedAccount, balance, changeCash } = require("./account");

      function main(params, context) {
        const u=operator(context);
        if(params.source_fund_account_no===params.target_fund_account_no) throw new HttpError(403, '转出和转入账户不能相同');
        const source=ownedAccount(params.source_fund_account_no,u,context,true), target=ownedAccount(params.target_fund_account_no,u,context,true);
        if(source.customer_no!==target.customer_no || source.currency!==target.currency) throw new HttpError(403, '只允许同客户同币种账户之间划转');
        const sb=balance(source), tb=balance(target);
        if(sb.trade_date!==tb.trade_date) throw new HttpError(403, '两个账户必须使用同一最新账期');
        const debit=changeCash(source,sb,params.amount_cents,true);
        const credit=changeCash(target,tb,params.amount_cents,false);
        if(debit.before+credit.before!==debit.after+credit.after) throw new HttpError(403, '资金划转守恒校验失败');
        return {trade_date:sb.trade_date,amount_cents:params.amount_cents,source:debit,target:credit,reason:params.reason};
      }
  - name: "correct_latest_close_price"
    title: "更正最新收盘价并重估持仓"
    description: "仅业务管理员；仅最新行情日，原子更正行情收盘/高低价并同步重估同日该证券全部持仓，不改成交和资金。"
    confirm: true
    parameters:
      security_code: {"type": "string", "description": "证券代码，例如 688001", "pattern": "^[0-9]{6}$"}
      trade_date: {"type": "string", "description": "最新演示账期，例如 2026-10-20", "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
      expected_close: {"type": "integer", "description": "更正前的收盘价，单位分；688001示例为8722", "min": 1, "max": 1000000}
      close_price: {"type": "integer", "description": "新收盘价，单位分", "min": 1, "max": 1000000}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator, administrator } = require("./employee");

      function main(params, context) {
        const u=operator(context); administrator(u);
        const last=conn.queryOne("SELECT MAX(trade_date) AS day FROM daily_quotes");
        if(params.trade_date!==last.day) throw new HttpError(403, '仅允许更正最新行情日，不回写历史价格');
        const q=conn.queryOne("SELECT id,close FROM daily_quotes WHERE security_code=:security_code AND trade_date=:trade_date", {security_code: params.security_code, trade_date: params.trade_date});
        if(!q || q.close!==params.expected_close) throw new HttpError(403, '行情不存在或原收盘价已变化');
        if(params.close_price===q.close) throw new HttpError(403, '新收盘价与当前值相同');
        const count=conn.queryOne("SELECT COUNT(*) AS n FROM positions WHERE security_code=:security_code AND trade_date=:trade_date", {security_code: params.security_code, trade_date: params.trade_date});
        const future=conn.queryOne("SELECT COUNT(*) AS n FROM positions WHERE security_code=:security_code AND trade_date>:trade_date", {security_code: params.security_code, trade_date: params.trade_date});
        if(future.n!==0) throw new HttpError(403, '已有后续持仓，不能更正历史收盘价');
        const n=conn.update("UPDATE daily_quotes SET close=:close_price, high=MAX(high,:close_price), low=MIN(low,:close_price) WHERE id=:q_id AND close=:expected_close", {close_price: params.close_price, q_id: q.id, expected_close: params.expected_close}).rowsAffected;
        if(n!==1) throw new HttpError(403, '行情已变化');
        const revalued=conn.update("UPDATE positions SET close_price=:close_price, market_value_cents=quantity*:close_price WHERE security_code=:security_code AND trade_date=:trade_date", {close_price: params.close_price, security_code: params.security_code, trade_date: params.trade_date}).rowsAffected;
        if(revalued!==count.n) throw new HttpError(403, '持仓集合已变化');
        const bad=conn.queryOne("SELECT COUNT(*) AS n FROM positions WHERE security_code=:security_code AND trade_date=:trade_date AND (close_price<>:close_price OR market_value_cents<>quantity*close_price)", {security_code: params.security_code, trade_date: params.trade_date, close_price: params.close_price});
        const after=conn.queryOne("SELECT close,high,low FROM daily_quotes WHERE id=:q_id", {q_id: q.id});
        if(bad.n!==0 || !after || after.close!==params.close_price || after.high<after.close || after.low>after.close) throw new HttpError(403, '行情或持仓重估后置校验失败');
        return {security_code:params.security_code,trade_date:params.trade_date,before:q.close,after:after.close,revalued_positions:revalued,reason:params.reason};
      }
actionLibraries:
  - name: employee
    title: 员工身份检查
    description: 在职员工与证券业务管理员检查
    script: |
      const conn = db.session();
      exports.operator = function(context) {
        const u = conn.queryOne("SELECT e.employee_id, e.status, r.code AS role_code FROM employees e JOIN roles r ON r.id=e.role_id WHERE e.employee_id=:context_userId", {context_userId: context.userId});
        if (!u || u.status !== 'active') throw new HttpError(403, '仅在职员工可执行演示操作');
        return u;
      }

      exports.administrator = function(u) {
        if (u.role_code !== 'ADMIN') throw new HttpError(403, '此操作仅证券业务管理员可执行');
      }
  - name: account
    title: 账户归属检查
    description: 资金账户归属、可见性与状态检查
    script: |
      const conn = db.session();
      exports.ownedAccount = function(no, u, context, active) {
        const a = conn.queryOne("SELECT fund_account_no, customer_no, manager_id, currency, status FROM fund_accounts WHERE fund_account_no=:no", {no: no});
        if (!a) throw new HttpError(403, '资金账户不存在或无权查看');
        if (a.manager_id !== context.userId && u.role_code !== 'ADMIN') throw new HttpError(403, '只能操作本人管理的资金账户；可查询不代表可修改');
        if (active && a.status !== 'active') throw new HttpError(403, '资金账户必须处于 active 状态');
        return a;
      }

      exports.balance = function(a) {
        const last=conn.queryOne("SELECT MAX(trade_date) AS day FROM daily_balances");
        const b=conn.queryOne("SELECT id,trade_date,opening_balance,transfer_in,transfer_out,buy_amount,sell_amount,fees,closing_balance,available_balance,withdrawable_balance FROM daily_balances WHERE fund_account_no=:a_fund_account_no AND trade_date=:last_day", {a_fund_account_no: a.fund_account_no, last_day: last.day});
        if(!b) throw new HttpError(403, '账户缺少最新日结，不能补写历史账期');
        if(!Number.isSafeInteger(b.closing_balance) || b.available_balance!==b.closing_balance || b.withdrawable_balance!==Math.max(0,b.closing_balance-b.sell_amount)) throw new HttpError(403, '日结精度或可用可取口径不符合演示模型');
        const flow=conn.queryOne("SELECT trade_date,balance_after FROM cash_flows WHERE fund_account_no=:a_fund_account_no ORDER BY id DESC LIMIT 1", {a_fund_account_no: a.fund_account_no});
        if(flow && (flow.balance_after!==b.closing_balance || flow.trade_date>b.trade_date)) throw new HttpError(403, '流水尾余额与日结不一致');
        return b;
      }

      exports.changeCash = function(a,b,amount,debit) {
        let n;
        if(debit) {
          n=conn.update("UPDATE daily_balances SET transfer_out=transfer_out+:amount, closing_balance=closing_balance-:amount, available_balance=available_balance-:amount, withdrawable_balance=MAX(0,closing_balance-:amount-sell_amount) WHERE id=:b_id AND closing_balance=:b_closing_balance AND available_balance>=:amount AND withdrawable_balance>=:amount", {amount: amount, b_id: b.id, b_closing_balance: b.closing_balance}).rowsAffected;
        } else {
          n=conn.update("UPDATE daily_balances SET transfer_in=transfer_in+:amount, closing_balance=closing_balance+:amount, available_balance=available_balance+:amount, withdrawable_balance=MAX(0,closing_balance+:amount-sell_amount) WHERE id=:b_id AND closing_balance=:b_closing_balance AND closing_balance<=9007199254740991-:amount", {amount: amount, b_id: b.id, b_closing_balance: b.closing_balance}).rowsAffected;
        }
        if(n!==1) throw new HttpError(403, '可取资金不足、余额已变化或超出安全整数范围');
        const after=conn.queryOne("SELECT closing_balance,available_balance,withdrawable_balance FROM daily_balances WHERE id=:b_id", {b_id: b.id});
        const delta=debit?-amount:amount, type=debit?'WITHDRAWAL':'DEPOSIT';
        if(after.closing_balance!==b.closing_balance+delta) throw new HttpError(403, '日结金额后置校验失败');
        const inserted=conn.update("INSERT INTO cash_flows(customer_no,fund_account_no,trade_date,flow_type,trade_id,amount_cents,fee_cents,balance_after) VALUES(:a_customer_no,:a_fund_account_no,:b_trade_date,:type,NULL,:delta,0,:after_closing_balance)", {a_customer_no: a.customer_no, a_fund_account_no: a.fund_account_no, b_trade_date: b.trade_date, type: type, delta: delta, after_closing_balance: after.closing_balance}).rowsAffected;
        if(inserted!==1) throw new HttpError(403, '资金流水写入失败');
        const check=conn.queryOne("SELECT SUM(CASE WHEN flow_type='DEPOSIT' THEN amount_cents ELSE 0 END) AS tin, SUM(CASE WHEN flow_type='WITHDRAWAL' THEN -amount_cents ELSE 0 END) AS tout FROM cash_flows WHERE fund_account_no=:a_fund_account_no AND trade_date=:b_trade_date", {a_fund_account_no: a.fund_account_no, b_trade_date: b.trade_date});
        const final=conn.queryOne("SELECT transfer_in,transfer_out,closing_balance FROM daily_balances WHERE id=:b_id", {b_id: b.id});
        if(check.tin!==final.transfer_in || check.tout!==final.transfer_out) throw new HttpError(403, '资金流水与日结转入转出对账失败');
        return {fund_account_no:a.fund_account_no,before:b.closing_balance,after:after.closing_balance,available_balance:after.available_balance,withdrawable_balance:after.withdrawable_balance};
      }
  - name: customer
    title: 客户归属检查
    description: 客户可见性、状态和全部账户归属检查
    script: |
      const conn = db.session();
      exports.ownedCustomer = function(no, u, context) {
        const c = conn.queryOne("SELECT customer_no, mobile, risk_level, investor_type, status FROM customers WHERE customer_no=:no", {no: no});
        if (!c || c.status !== 'active') throw new HttpError(403, '客户不存在、非正常状态或无权查看');
        const ownership = conn.queryOne("SELECT COUNT(*) AS total, SUM(CASE WHEN manager_id<>:context_userId THEN 1 ELSE 0 END) AS other_accounts_n FROM fund_accounts WHERE customer_no=:no", {context_userId: context.userId, no: no});
        if (!ownership || ownership.total===0 || (u.role_code!=='ADMIN' && ownership.other_accounts_n>0)) throw new HttpError(403, '客户资料由多个经理共享，须全部账户归本人管理或由业务管理员修改');
        return c;
      }
