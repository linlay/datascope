  - name: "freeze_fund_account"
    title: "冻结资金账户"
    description: "仅本人管理的资金账户或业务管理员可操作；不修改资金、成交和持仓。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator } = require("./employee");
      const { ownedAccount } = require("./account");

      function main(params, context) {
        const u=operator(context), a=ownedAccount(params.fund_account_no,u,context,false);
        if(a.status!=='active') throw new HttpError(403, '仅 active 状态可执行此操作');
        const n=conn.update("UPDATE fund_accounts SET status='frozen' WHERE fund_account_no=:a_fund_account_no AND manager_id=:a_manager_id AND status='active'", {a_fund_account_no: a.fund_account_no, a_manager_id: a.manager_id}).rowsAffected;
        if(n!==1) throw new HttpError(403, '账户状态或归属已变化，请重新预览');
        const after=conn.queryOne("SELECT status FROM fund_accounts WHERE fund_account_no=:a_fund_account_no", {a_fund_account_no: a.fund_account_no});
        if(!after || after.status!=='frozen') throw new HttpError(403, '账户状态后置校验失败');
        return {fund_account_no:a.fund_account_no,before:'active',after:after.status,reason:params.reason};
      }
  - name: "unfreeze_fund_account"
    title: "解冻资金账户"
    description: "仅本人管理的资金账户或业务管理员可操作；不修改资金、成交和持仓。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator } = require("./employee");
      const { ownedAccount } = require("./account");

      function main(params, context) {
        const u=operator(context), a=ownedAccount(params.fund_account_no,u,context,false);
        if(a.status!=='frozen') throw new HttpError(403, '仅 frozen 状态可执行此操作');
        const n=conn.update("UPDATE fund_accounts SET status='active' WHERE fund_account_no=:a_fund_account_no AND manager_id=:a_manager_id AND status='frozen'", {a_fund_account_no: a.fund_account_no, a_manager_id: a.manager_id}).rowsAffected;
        if(n!==1) throw new HttpError(403, '账户状态或归属已变化，请重新预览');
        const after=conn.queryOne("SELECT status FROM fund_accounts WHERE fund_account_no=:a_fund_account_no", {a_fund_account_no: a.fund_account_no});
        if(!after || after.status!=='active') throw new HttpError(403, '账户状态后置校验失败');
        return {fund_account_no:a.fund_account_no,before:'frozen',after:after.status,reason:params.reason};
      }
  - name: "reassign_account_manager"
    title: "调整账户客户经理"
    description: "仅业务管理员；校验原经理和目标在职客户经理，修改后立即影响行权限。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      expected_manager_id: {"type": "integer", "description": "当前客户经理编号", "min": 1}
      new_manager_id: {"type": "integer", "description": "目标在职客户经理编号，例如 2", "min": 1}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator, administrator } = require("./employee");
      const { ownedAccount } = require("./account");

      function main(params, context) {
        const u=operator(context); administrator(u);
        const a=ownedAccount(params.fund_account_no,u,context,false);
        if(a.manager_id!==params.expected_manager_id) throw new HttpError(403, '原客户经理已变化');
        if(params.new_manager_id===a.manager_id) throw new HttpError(403, '目标经理与当前经理相同');
        const target=conn.queryOne("SELECT e.employee_id FROM employees e JOIN roles r ON r.id=e.role_id WHERE e.employee_id=:new_manager_id AND e.status='active' AND r.code='MANAGER'", {new_manager_id: params.new_manager_id});
        if(!target) throw new HttpError(403, '目标必须是在职客户经理');
        const n=conn.update("UPDATE fund_accounts SET manager_id=:new_manager_id WHERE fund_account_no=:a_fund_account_no AND manager_id=:expected_manager_id", {new_manager_id: params.new_manager_id, a_fund_account_no: a.fund_account_no, expected_manager_id: params.expected_manager_id}).rowsAffected;
        if(n!==1) throw new HttpError(403, '账户归属已变化');
        const after=conn.queryOne("SELECT manager_id FROM fund_accounts WHERE fund_account_no=:a_fund_account_no", {a_fund_account_no: a.fund_account_no});
        if(!after || after.manager_id!==params.new_manager_id) throw new HttpError(403, '账户归属后置校验失败');
        return {fund_account_no:a.fund_account_no,before:a.manager_id,after:after.manager_id,reason:params.reason};
      }
  - name: "update_employee_mobile"
    title: "修改员工手机号"
    description: "在职员工可修改本人联系方式；业务管理员可修改其他在职员工。"
    confirm: true
    parameters:
      employee_id: {"type": "integer", "description": "员工编号，例如 1", "min": 1}
      mobile: {"type": "string", "description": "合成演示手机号码，例如 13900001359", "pattern": "^1[3-9][0-9]{9}$"}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator } = require("./employee");

      function main(params, context) {
        const u=operator(context);
        if(params.employee_id!==context.userId && u.role_code!=='ADMIN') throw new HttpError(403, '只能修改本人联系方式');
        const before=conn.queryOne("SELECT employee_id,mobile,status FROM employees WHERE employee_id=:employee_id", {employee_id: params.employee_id});
        if(!before || before.status!=='active') throw new HttpError(403, '目标员工不存在、已离职或不可见');
        if(before.mobile===params.mobile) throw new HttpError(403, '新手机号与当前值相同');
        const n=conn.update("UPDATE employees SET mobile=:mobile WHERE employee_id=:employee_id AND mobile=:before_mobile AND status='active'", {mobile: params.mobile, employee_id: params.employee_id, before_mobile: before.mobile}).rowsAffected;
        if(n!==1) throw new HttpError(403, '员工资料已变化');
        const after=conn.queryOne("SELECT mobile FROM employees WHERE employee_id=:employee_id", {employee_id: params.employee_id});
        if(!after || after.mobile!==params.mobile) throw new HttpError(403, '员工联系方式后置校验失败');
        return {employee_id:params.employee_id,before:before.mobile,after:after.mobile,reason:params.reason};
      }
