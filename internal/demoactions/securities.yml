# 证券演示操作；经显式安装后存入逐库 YAML，不自动读取。
version: 1
actions:
  - name: "update_customer_mobile"
    title: "修改客户手机号"
    description: "修改客户共享资料；要求客户全部账户归本人管理，或证券业务管理员执行。"
    confirm: true
    parameters:
      customer_no: {"type": "string", "description": "客户编号，例如 C00001359", "pattern": "^C[0-9]{8}$"}
      mobile: {"type": "string", "description": "合成演示手机号码，例如 13900001359", "pattern": "^1[3-9][0-9]{9}$"}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator } = require("./employee");
      const { ownedCustomer } = require("./customer");

      function main(params, context) {
        const u=operator(context), before=ownedCustomer(params.customer_no,u,context);
        if (before.mobile===params.mobile) throw new HttpError(403, '新值与当前值相同，无需修改');
        const n=conn.update("UPDATE customers SET mobile=:mobile WHERE customer_no=:customer_no AND mobile=:before_mobile AND status='active'", {mobile: params.mobile, customer_no: params.customer_no, before_mobile: before.mobile}).rowsAffected;
        if(n!==1) throw new HttpError(403, '客户资料已变化，请重新预览');
        const after=conn.queryOne("SELECT customer_no, mobile FROM customers WHERE customer_no=:customer_no", {customer_no: params.customer_no});
        if(!after || after.mobile!==params.mobile) throw new HttpError(403, '客户资料后置校验失败');
        return {customer_no:params.customer_no,before:before.mobile,after:after.mobile,reason:params.reason};
      }
