      const conn = db.session();
      const { operator, administrator } = require("./employee");

      function main(params, context) {
        const u=operator(context); administrator(u);
        const before=conn.queryOne("SELECT code,address FROM branches WHERE code=:code", {code: params.code});
        if(!before) throw new HttpError(403, '目录记录不存在或不可见');
