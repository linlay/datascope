  - name: "cancel_order_remainder"
    title: "撤销未成交委托余量"
    description: "仅 PARTIAL 委托可转为 PART_CANCELLED，保留已有成交、费用和持仓；样例库未建冻结资金/证券模型，不生成退款。"
    confirm: true
    parameters:
      order_no: {"type": "string", "description": "委托编号，例如 O0000002309", "pattern": "^O[0-9]{10}$"}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator } = require("./employee");
      const { ownedAccount } = require("./account");

      function main(params, context) {
        const u=operator(context), o=conn.queryOne("SELECT id,order_no,fund_account_no,status,quantity,filled_quantity FROM orders WHERE order_no=:order_no", {order_no: params.order_no});
        if(!o) throw new HttpError(403, '委托不存在或无权查看');
        ownedAccount(o.fund_account_no,u,context,true);
        if(o.status!=='PARTIAL' || o.filled_quantity<=0 || o.filled_quantity>=o.quantity) throw new HttpError(403, '只有部分成交且仍有余量的委托可撤余单');
        const trades=conn.queryOne("SELECT COALESCE(SUM(quantity),0) AS n FROM trades WHERE order_id=:o_id", {o_id: o.id});
        if(trades.n!==o.filled_quantity) throw new HttpError(403, '委托与成交数量不一致，不能撤单');
        const n=conn.update("UPDATE orders SET status='PART_CANCELLED' WHERE id=:o_id AND status='PARTIAL' AND quantity=:o_quantity AND filled_quantity=:o_filled_quantity", {o_id: o.id, o_quantity: o.quantity, o_filled_quantity: o.filled_quantity}).rowsAffected;
        if(n!==1) throw new HttpError(403, '委托状态已变化');
        const after=conn.queryOne("SELECT status,filled_quantity FROM orders WHERE id=:o_id", {o_id: o.id});
        if(!after || after.status!=='PART_CANCELLED' || after.filled_quantity!==o.filled_quantity) throw new HttpError(403, '撤单后置校验失败');
        return {order_no:o.order_no,before:o.status,after:after.status,cancelled_quantity:o.quantity-o.filled_quantity,filled_quantity:o.filled_quantity,reason:params.reason};
      }
  - name: "update_order_channel"
    title: "更正委托来源渠道"
    description: "仅修改 APP/PC/COUNTER 来源元数据；不得修改成交、价格、数量和金额。"
    confirm: true
    parameters:
      order_no: {"type": "string", "description": "委托编号，例如 O0000002309", "pattern": "^O[0-9]{10}$"}
      channel: {"type": "string", "description": "来源渠道", "enum": ["APP", "PC", "COUNTER"]}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator } = require("./employee");
      const { ownedAccount } = require("./account");

      function main(params, context) {
        const u=operator(context), o=conn.queryOne("SELECT id,order_no,fund_account_no,channel FROM orders WHERE order_no=:order_no", {order_no: params.order_no});
        if(!o) throw new HttpError(403, '委托不存在或不可见');
        ownedAccount(o.fund_account_no,u,context,false);
        if(o.channel===params.channel) throw new HttpError(403, '新渠道与当前值相同');
        const n=conn.update("UPDATE orders SET channel=:channel WHERE id=:o_id AND channel=:o_channel", {channel: params.channel, o_id: o.id, o_channel: o.channel}).rowsAffected;
        if(n!==1) throw new HttpError(403, '委托元数据已变化');
        const after=conn.queryOne("SELECT channel FROM orders WHERE id=:o_id", {o_id: o.id});
        if(!after || after.channel!==params.channel) throw new HttpError(403, '渠道后置校验失败');
        return {order_no:o.order_no,before:o.channel,after:after.channel,reason:params.reason};
      }
  - name: "close_unused_stock_account"
    title: "删除无委托的证券账户"
    description: "仅本人账户或业务管理员操作；保留所有被历史委托引用的账户。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      exchange: {"type": "string", "description": "证券交易所", "enum": ["SH", "SZ"]}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator } = require("./employee");
      const { ownedAccount } = require("./account");

      function main(params, context) {
        const u=operator(context), a=ownedAccount(params.fund_account_no,u,context,true);
         const old=conn.queryOne("SELECT id,stock_account_no FROM stock_accounts WHERE fund_account_no=:a_fund_account_no AND exchange=:exchange", {a_fund_account_no: a.fund_account_no, exchange: params.exchange});

         if(!old) throw new HttpError(403, '证券账户不存在或不可见');
         const used=conn.queryOne("SELECT COUNT(*) AS n FROM orders WHERE stock_account_id=:old_id", {old_id: old.id});
         if(used.n!==0) throw new HttpError(403, '证券账户已有历史委托，不可删除');
         const n=conn.update("DELETE FROM stock_accounts WHERE id=:old_id AND fund_account_no=:a_fund_account_no AND stock_account_no=:old_stock_account_no AND NOT EXISTS(SELECT 1 FROM orders WHERE stock_account_id=:old_id)", {old_id: old.id, a_fund_account_no: a.fund_account_no, old_stock_account_no: old.stock_account_no}).rowsAffected;
         if(n!==1) throw new HttpError(403, '证券账户已变化或已被委托引用');
         if(conn.queryOne("SELECT id FROM stock_accounts WHERE id=:old_id", {old_id: old.id})) throw new HttpError(403, '证券账户删除后置校验失败');
         return {fund_account_no:a.fund_account_no,exchange:params.exchange,stock_account_no:old.stock_account_no,deleted:true,reason:params.reason};
      }
  - name: "open_stock_account"
    title: "新增证券账户"
    description: "仅本人账户或业务管理员操作；保留所有被历史委托引用的账户。"
    confirm: true
    parameters:
      fund_account_no: {"type": "string", "description": "12 位资金账号，例如 880000001913", "pattern": "^880[0-9]{9}$"}
      exchange: {"type": "string", "description": "证券交易所", "enum": ["SH", "SZ"]}
      stock_account_no: {"type": "string", "description": "沪 A+9位数字；深10位数字，例如 9000000164", "maxLength": 10}
      reason: {"type": "string", "description": "修改原因；会进入执行结果与审计", "maxLength": 200, "pattern": "\\S"}
    script: |
      const conn = db.session();
      const { operator } = require("./employee");
      const { ownedAccount } = require("./account");

      function main(params, context) {
        const u=operator(context), a=ownedAccount(params.fund_account_no,u,context,true);
         const old=conn.queryOne("SELECT id,stock_account_no FROM stock_accounts WHERE fund_account_no=:a_fund_account_no AND exchange=:exchange", {a_fund_account_no: a.fund_account_no, exchange: params.exchange});

         if(old) throw new HttpError(403, '该资金账户已存在此交易所的证券账户，请先删除无委托账户');
         if(params.exchange==='SH' ? !/^A[0-9]{9}$/.test(params.stock_account_no) : !/^[0-9]{10}$/.test(params.stock_account_no)) throw new HttpError(403, '证券账号格式与交易所不符');
         if(conn.queryOne("SELECT id FROM stock_accounts WHERE stock_account_no=:stock_account_no", {stock_account_no: params.stock_account_no})) throw new HttpError(403, '证券账号已被使用');
         const n=conn.update("INSERT INTO stock_accounts(fund_account_no,exchange,stock_account_no) VALUES(:a_fund_account_no,:exchange,:stock_account_no)", {a_fund_account_no: a.fund_account_no, exchange: params.exchange, stock_account_no: params.stock_account_no}).rowsAffected;
         if(n!==1) throw new HttpError(403, '证券账户新增失败');
         const after=conn.queryOne("SELECT stock_account_no FROM stock_accounts WHERE fund_account_no=:a_fund_account_no AND exchange=:exchange", {a_fund_account_no: a.fund_account_no, exchange: params.exchange});
         if(!after || after.stock_account_no!==params.stock_account_no) throw new HttpError(403, '证券账户新增后置校验失败');
         return {fund_account_no:a.fund_account_no,exchange:params.exchange,stock_account_no:after.stock_account_no,created:true,reason:params.reason};
      }
