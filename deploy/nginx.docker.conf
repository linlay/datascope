server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Hashed Vite assets must never fall back to index.html. Returning HTML for
    # a missing module produces a misleading strict MIME-type browser error.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/proxy_params;
    }

    location = /mcp/admin {
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /.well-known/oauth-protected-resource/mcp/admin {
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
    }

    location ^~ /mcp {
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:18080;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
    }

    # Management calls include synchronous model generation.
    location = /api/management/call {
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location ~ ^/(api|oauth|auth)/ {
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/proxy_params;
        proxy_buffering off;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/proxy_params;
    }

    location ^~ /.well-known/oauth-authorization-server/ {
        proxy_pass http://127.0.0.1:18081;
        include /etc/nginx/proxy_params;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
